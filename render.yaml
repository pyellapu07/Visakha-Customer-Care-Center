services:
  - type: web
    name: haier-service-os-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: GCC_EMAIL
        value: hgins01105@gcc.haier.net
      - key: GCC_PASSWORD
        sync: false          # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
